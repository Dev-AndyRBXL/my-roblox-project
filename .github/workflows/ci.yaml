name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Selene
        run: |
          curl -L https://github.com/Kampfkarren/selene/releases/latest/download/selene-linux.zip -o selene.zip
          sudo apt-get update && sudo apt-get install -y unzip
          unzip selene.zip -d selene
          sudo mv selene/selene /usr/local/bin/selene

      - name: Lint with Selene
        run: selene ./modules

  style:
    name: Styling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install luau-lsp
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -L https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux.zip -o luau-lsp.zip
          unzip luau-lsp.zip -d luau-lsp
          # move the binary (adjust path if archive changes)
          sudo mv luau-lsp/luau-lsp /usr/local/bin/luau-lsp

      - name: Run luau-lsp
        run: luau-lsp --version
